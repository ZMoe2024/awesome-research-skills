<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">加入科研 AI 社区</title>
  <desc id="desc">联系 Moe，说明研究方向与加入目的，人工审核通过后邀请加入。点击横幅查看联系方式。</desc>
  <rect width="1200" height="300" rx="18" fill="#153e66"/>
  <rect x="0" y="30" width="8" height="240" rx="4" fill="#70d9dc"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
    <text x="48" y="50" fill="#b5d8f0" font-size="18" font-weight="700" letter-spacing="2">科研能力市场 · 社区招募</text>
    <text x="48" y="124" fill="#ffffff" font-size="52" font-weight="800">加入科研 AI 社区</text>
    <text x="48" y="174" fill="#e4eff8" font-size="23">分享好工具、实用教程，一起解决科研真问题。</text>
    <text x="48" y="241" fill="#b5d8f0" font-size="19">申请时请说明：研究方向 + 加入目的</text>
    <rect x="855" y="42" width="297" height="43" rx="21" fill="#294f73"/>
    <text x="1003" y="71" text-anchor="middle" fill="#ffd783" font-size="20" font-weight="700">申请制 · 人工审核</text>
    <rect x="855" y="110" width="297" height="74" rx="10" fill="#ffffff"/>
    <text x="1003" y="157" text-anchor="middle" fill="#153e66" font-size="27" font-weight="800">联系 Moe 申请 ↗</text>
    <text x="1003" y="227" text-anchor="middle" fill="#e4eff8" font-size="19">点击横幅，查看联系方式</text>
    <text x="1003" y="260" text-anchor="middle" fill="#b5d8f0" font-size="17">审核通过后邀请加入</text>
  </g>
</svg>
